name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          # This private repo does not have GitHub Code Security enabled. Keep
          # CodeQL as a CI gate without requiring a repository/billing change.
          upload: never
      - name: Gate CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(find codeql-results -type f -name '*.sarif' -print0)
          if (( ${#sarif_files[@]} == 0 )); then
            echo '::error::CodeQL did not produce a SARIF result.'
            exit 1
          fi
          jq -s -e '[.[].runs[]?.results[]?] | length == 0' "${sarif_files[@]}"
      - name: Retain CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
